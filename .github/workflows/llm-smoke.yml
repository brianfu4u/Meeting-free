name: LLM Smoke
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Real LLM Assembly Smoke (hardened proxy)
        env:
          LLM_SMOKE_ENDPOINT: ${{ secrets.LLM_SMOKE_ENDPOINT }}
          LLM_SMOKE_KEY: ${{ secrets.LLM_SMOKE_KEY }}
        run: node src/lib/composition/llmSmokeCi.mjs
